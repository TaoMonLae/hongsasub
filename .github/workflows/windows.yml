name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/ffmpeg-windows.ps1
      - run: pnpm release:windows
      - name: Verify installation and startup
        shell: pwsh
        run: |
          $installer = Get-Item target/release/bundle/nsis/*-setup.exe
          $dest = Join-Path $env:RUNNER_TEMP HongsaSub
          $setup = Start-Process $installer.FullName -ArgumentList "/S","/D=$dest" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $app = Get-Item "$dest/hongsasub.exe"
          if (!(Test-Path "$dest/mondict.sqlite") -or !(Test-Path "$dest/fonts/*.ttf")) { throw "Missing language resources" }
          if (!(Test-Path "$dest/ffmpeg-licence/LICENSE.txt")) { throw "Missing FFmpeg licence" }
          foreach ($tool in "ffmpeg", "ffprobe") {
            $lines = & "$dest/$tool.exe" -hide_banner -version
            if ($LASTEXITCODE -ne 0) { throw "Bundled $tool does not run" }
            Write-Output $lines[0]
          }
          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "App exited during startup" }
          Stop-Process -Id $process.Id
          Copy-Item $installer.FullName HongsaSub-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: HongsaSub-windows-x64-setup.exe
